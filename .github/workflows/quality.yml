name: Qualidade

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  desktop-windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build completo de produção
        shell: pwsh
        run: .\build.ps1
      - name: Validar pacote, hash e executável interno
        shell: pwsh
        run: |
          $zip = Get-ChildItem -LiteralPath dist -Filter '*.zip' | Select-Object -First 1
          if (-not $zip) { throw 'ZIP de produção ausente.' }
          $hashFile = Get-Item -LiteralPath "$($zip.FullName).sha256"
          $expected = (Get-Content -LiteralPath $hashFile.FullName).Split()[0]
          $actual = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash
          if ($expected -ne $actual) { throw "SHA-256 divergente: $expected != $actual" }
          $extract = Join-Path $env:RUNNER_TEMP 'ism-package-check'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $extract -Force
          if (-not (Get-ChildItem -LiteralPath $extract -Filter '*.exe' -Recurse)) {
            throw 'Executável ausente dentro do ZIP.'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: PermeabilimetroSupervisorio-Windows
          path: dist/
          if-no-files-found: error
          retention-days: 14

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install platformio==6.1.18
      - run: python -m platformio run -d firmware
